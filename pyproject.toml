[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provador"
version = "0.1.0"
description = "Provador Virtual 3D em tempo real (webcam + MediaPipe + ModernGL)"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provador = ["shaders/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tools", "tests"]
